name: ci

on:
  push:
    # The default branch is master. This said `main`, so no push build
    # had ever run.
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_only:
        description: Run only the Windows legs
        type: boolean
        default: false

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every leg reports. A platform-specific break is the thing this
      # matrix exists to find, so one red cell must not cancel the run
      # that would have shown whether it is platform- or version-shaped.
      fail-fast: false
      matrix:
        # Node 20 is the floor `engines` claims (>=20.18.1), so it is
        # tested everywhere that floor is claimed rather than on POSIX
        # alone. Windows is exactly where a version-specific difference
        # in fs/child_process would otherwise surface unseen.
        os: ${{ inputs.windows_only && fromJSON('["windows-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The npm bundled with Node 20 and 22 (10.8.2 / 10.9.8) dies here
      # with "Exit handler never called!" on this lockfile. On Node 22 it
      # exits 1; on Node 20 it exits 0 having installed nothing, so the
      # step passes and the next one silently runs against an empty
      # node_modules. npm 11 installs it in seconds.
      - run: npm install -g npm@11
      - run: npm ci
      # `npm run typecheck`, never `npx tsc`: with node_modules missing
      # or incomplete, npx does not fail, it downloads the unrelated
      # `tsc` package off the registry and runs that instead. Going
      # through the package script can only ever resolve the local
      # TypeScript.
      - run: npm run typecheck
      # Build before test, not after: the daemon-autostart test spawns
      # dist/cli.js. spawnDaemonDetached resolves ./daemon.js relative to
      # its own module, so it only resolves inside dist/ and there is no
      # in-process way to cover it. The test skips itself when dist is
      # absent, which keeps a bare `npm test` working locally.
      - run: npm run build
      - run: npm test
        env:
          HYDRA_ACP_TEST_CLEANUP_LOG: ${{ runner.temp }}/cleanup-log
      # Per-test home sweeps that retried or gave up (see vitest.setup.ts).
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-log-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/cleanup-log
          if-no-files-found: ignore

  # The single check branch protection requires. Do not rename it.
  #
  # The matrix jobs are named from their own matrix values
  # (`ubuntu-latest / node 20`, ...), so requiring those names directly
  # means the required list stops matching the moment the matrix changes,
  # and the gate silently stops gating. That is the same failure this
  # workflow already had once, when the push trigger named a branch that
  # did not exist and no CI ran at all for the life of the repo. One
  # stable name that the matrix feeds into cannot drift that way.
  all-checks:
    name: all-checks
    runs-on: ubuntu-latest
    needs: test
    # always(), so this still runs when a matrix leg fails. Without it the
    # job is skipped instead, and a skipped check does not reliably block
    # a merge — it would report success by absence.
    if: always()
    steps:
      # `needs.test.result` is the whole matrix collapsed to one value:
      # success only if every leg succeeded, so this covers failure,
      # cancellation and skips alike.
      - name: Require every matrix leg to have passed
        if: needs.test.result != 'success'
        run: |
          echo "matrix result: ${{ needs.test.result }}"
          exit 1
      - run: echo "all matrix legs passed"
